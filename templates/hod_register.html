
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HOD Registration | CampusCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #081426;
            color: #edf6ff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .register-container {
            width: 100%;
            max-width: 650px;
            background: #111f35;
            border: 1px solid #29415e;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 15px 40px rgba(0,0,0,.3);
        }

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .heading i {
            font-size: 38px;
            color: #35c6e8;
        }

        .heading h2 {
            color: #35c6e8;
            margin-bottom: 8px;
        }

        .heading p {
            color: #a9bbcf;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #dcecff;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 13px;
            background: #09172a;
            border: 1px solid #35516d;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #35c6e8;
        }

        select option {
            background: #09172a;
        }

        .register-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #12b9d6;
            color: #061321;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #45d7ef;
        }

        .bottom-link {
            text-align: center;
            margin-top: 22px;
            color: #a9bbcf;
        }

        .bottom-link a {
            color: #35c6e8;
            text-decoration: none;
        }

        .flash-message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            background: #20354b;
            color: #eaf6ff;
        }

        @media(max-width: 550px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .register-container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="heading">
        <i class="fas fa-user-tie"></i>
        <h2>HOD Registration</h2>
        <p>Create your Head of Department account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash-message">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="form-grid">

            <div class="form-group full">
                <label>Full Name *</label>
                <input type="text" name="name"
                       placeholder="Enter your full name"
                       value="{{ request.form.get('name', '') }}"
                       required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" name="email"
                       placeholder="Enter email"
                       value="{{ request.form.get('email', '') }}"
                       required>
            </div>

            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" name="mobile"
                       placeholder="Enter mobile number"
                       value="{{ request.form.get('mobile', '') }}"
                       required>
            </div>

            <div class="form-group">
                <label>Department *</label>
                <select name="department" required>
                    <option value="">Select Department</option>

                    {% for dept in departments %}
                        <option value="{{ dept.department_name }}"
                            {% if request.form.get('department') == dept.department_name %}selected{% endif %}>
                            {{ dept.department_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Designation</label>
                <input type="text" name="designation"
                       placeholder="Head of Department"
                       value="{{ request.form.get('designation', '') }}">
            </div>

            <div class="form-group full">
                <label>College Name *</label>
                <input type="text" name="college"
                       placeholder="Enter college name"
                       value="{{ request.form.get('college', '') }}"
                       required>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" name="password"
                       placeholder="Minimum 8 characters"
                       minlength="8" required>
            </div>

            <div class="form-group">
                <label>Confirm Password *</label>
                <input type="password" name="confirm_password"
                       placeholder="Confirm password"
                       minlength="8" required>
            </div>

        </div>

        <button type="submit" class="register-btn">
            <i class="fas fa-user-plus"></i>
            Submit Registration
        </button>

    </form>

    <div class="bottom-link">
        Already registered?
        <a href="{{ url_for('login') }}">Login Here</a>
    </div>

</div>

</body>
</html>
