

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login | CampusCare</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #071426, #102b46);
            color: #fff;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: #102238;
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 212, 255, 0.12);
            color: #00d4ff;
            border-radius: 16px;
            font-size: 28px;
        }

        .brand h1 {
            font-size: 27px;
            margin-bottom: 7px;
        }

        .brand p {
            color: #9fb2c8;
            font-size: 14px;
        }

        .admin-label {
            display: inline-block;
            margin-top: 13px;
            padding: 7px 14px;
            border-radius: 20px;
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            color: #dce7f2;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00c8ef;
        }

        .input-box input {
            width: 100%;
            padding: 14px 15px 14px 43px;
            background: #091a2b;
            border: 1px solid #29435d;
            border-radius: 9px;
            outline: none;
            color: #fff;
            font-size: 14px;
        }

        .input-box input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 23px;
            color: #00d4ff;
            text-decoration: none;
            font-size: 13px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #00bfe8, #008fce);
            color: #061827;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 191, 232, 0.25);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #9fb2c8;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #00d4ff;
        }

        .flash {
            padding: 11px;
            margin-bottom: 18px;
            border-radius: 7px;
            font-size: 13px;
            text-align: center;
        }

        .flash.error {
            background: rgba(255, 70, 70, 0.12);
            color: #ff8585;
            border: 1px solid rgba(255, 70, 70, 0.25);
        }

        .flash.success {
            background: rgba(0, 220, 140, 0.12);
            color: #65e6b0;
            border: 1px solid rgba(0, 220, 140, 0.25);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">
        <div class="brand-icon">
            <i class="fas fa-shield-halved"></i>
        </div>

        <h1>CampusCare</h1>
        <p>College Management & Support Portal</p>

        <span class="admin-label">SUPER ADMIN PORTAL</span>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="form-group">
            <label for="email">Admin Email</label>

            <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                    autocomplete="username">
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="input-box">
                <i class="fas fa-lock"></i>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password">
            </div>
        </div>

        <a href="#" class="forgot"
           onclick="return false;">
            Forgot Password?
        </a>

        <button type="submit" class="login-btn">
            <i class="fas fa-right-to-bracket"></i>
            Sign In as Super Admin
        </button>

    </form>

    <a href="{{ url_for('admin_login') }}" class="back-link">
        <i class="fas fa-arrow-left"></i>
        Back to Main Login
    </a>

</div>

</body>
</html>
